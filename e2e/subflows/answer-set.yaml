# Answers the six cards of the current set in order, correctly, and stops on its Summary.
# Parameters, passed as env by the calling flow:
#   QUIZ_OPTION, PREDICT_OPTION  the correct option's text, as a regular expression
#   EXERCISE_CODE                code that passes the exercise card's check
#   CHECKPOINT_CODE              code that passes the checkpoint card's rubric
#   CHECKPOINT_SCORE             the score line that code earns, as a regular expression
#   SHOTS                        'true' to take a screenshot of each card, else 'false'
# The caller must pass every one: a default set here would override the caller's value.
appId: com.frankiesoltero.doomskill
---
# 1. Concept: answered on sight.
- assertVisible: 'Card 1 of 7'
- runFlow:
    when:
      true: ${SHOTS == 'true'}
    commands:
      - takeScreenshot: 01-concept
- tapOn: 'Got it'

# 2. Quiz. Unanswered, it refuses the swipe up and shows the gate toast.
- extendedWaitUntil:
    visible: 'Card 2 of 7'
    timeout: 5000
- swipe:
    start: 50%, 60%
    end: 50%, 25%
- assertVisible: 'Answer this card to continue'
- runFlow:
    when:
      true: ${SHOTS == 'true'}
    commands:
      - takeScreenshot: 00-gate-toast
- assertVisible: 'Card 2 of 7'
- tapOn: ${QUIZ_OPTION}
- assertVisible: '.*\. Correct answer\.'
- assertVisible: 'Correct\. .*'
- extendedWaitUntil:
    notVisible: 'Answer this card to continue'
    timeout: 5000
- runFlow:
    when:
      true: ${SHOTS == 'true'}
    commands:
      - takeScreenshot: 02-quiz-answered
- tapOn: 'Next card'

# 3. Predict.
- extendedWaitUntil:
    visible: 'Card 3 of 7'
    timeout: 5000
- tapOn: ${PREDICT_OPTION}
- assertVisible: '.*\. Correct answer\.'
- assertVisible: 'Correct\. .*'
- runFlow:
    when:
      true: ${SHOTS == 'true'}
    commands:
      - takeScreenshot: 03-predict-answered
- tapOn: 'Next card'

# 4. Exercise: type the solution, check it, then play it. The flow checks the playing state
# (Stop in place of Play). It does not judge the sound.
- extendedWaitUntil:
    visible: 'Card 4 of 7'
    timeout: 5000
- runFlow:
    file: replace-code.yaml
    env:
      CODE: ${EXERCISE_CODE}
- tapOn: 'Check'
- assertVisible: 'Spec met'
- extendedWaitUntil:
    visible:
      text: 'Play'
      enabled: true
    timeout: 15000
- tapOn: 'Play'
- extendedWaitUntil:
    visible: 'Stop'
    timeout: 15000
- assertNotVisible: 'Audio unavailable'
- runFlow:
    when:
      true: ${SHOTS == 'true'}
    commands:
      - takeScreenshot: 04-exercise-pass-playing
      # Two pictures of the beat grid a moment apart, to show the playhead moving.
      - takeScreenshot:
          path: 04a-beat-grid-playing
          cropOn:
            id: 'beat-grid'
      - takeScreenshot:
          path: 04b-beat-grid-playing-later
          cropOn:
            id: 'beat-grid'
- assertVisible: 'Stop'
- tapOn: 'Next card'

# 5. Review: reveal, then rate. The card moves on by itself 550 ms after the rating.
- extendedWaitUntil:
    visible: 'Card 5 of 7'
    timeout: 5000
- tapOn: 'Recall it, then tap to reveal'
- assertVisible: 'How well did you remember?'
- runFlow:
    when:
      true: ${SHOTS == 'true'}
    commands:
      - takeScreenshot: 05-review-revealed
- tapOn: 'Good, next review in .*'

# 6. Checkpoint: type the solution and submit it for grading.
- extendedWaitUntil:
    visible: 'Card 6 of 7'
    timeout: 5000
- runFlow:
    file: replace-code.yaml
    env:
      CODE: ${CHECKPOINT_CODE}
- tapOn: 'Submit for grading'
- extendedWaitUntil:
    visible: ${CHECKPOINT_SCORE}
    timeout: 10000
- runFlow:
    when:
      true: ${SHOTS == 'true'}
    commands:
      - takeScreenshot: 06-checkpoint-graded
- tapOn: 'Finish today'

# 7. The Summary.
- extendedWaitUntil:
    visible: 'Card 7 of 7'
    timeout: 5000
- assertVisible: 'DAY 4 COMPLETE'
- assertVisible: 'Keep going'
